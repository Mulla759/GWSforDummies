name: nightly-gmail-label

# Runs the same scripts/nightly-label.sh on GitHub's servers, so labeling happens
# even when your PC is off. Requires a repo secret named GWS_CREDENTIALS (see
# GITHUB-ACTIONS.md). Use a PRIVATE repo — the secret grants mailbox access.

on:
  schedule:
    # Cron is always UTC — adjust "0 7 * * *" to your own timezone. Also note it
    # shifts by 1h across daylight-saving changes, and GitHub may delay scheduled
    # runs under load; the 2-day window below absorbs that.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # also lets you run it on demand from the Actions tab

permissions:
  contents: read
  issues: write   # the failure-notification step opens/updates a tracking issue

concurrency:
  group: nightly-gmail-label
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gws
        run: npm install -g @googleworkspace/cli

      - name: Restore gws credentials from secret
        env:
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
        run: printf '%s' "$GWS_CREDENTIALS" > "$HOME/gws-creds.json"

      - name: Run the labeler
        env:
          GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE: /home/runner/gws-creds.json
          GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND: file
        run: bash ./scripts/nightly-label.sh "newer_than:2d"

      - name: Scrub credentials
        if: always()
        run: rm -f "$HOME/gws-creds.json"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ nightly-gmail-label failed"
          body=$(printf 'The scheduled Gmail labeler failed on %s.\n\nRun log: %s/%s/actions/runs/%s\n\nMost likely cause: the GWS_CREDENTIALS token expired or was revoked. Refresh it from an authenticated machine:\n\n```\ngws auth export --unmasked | gh secret set GWS_CREDENTIALS --repo %s\n```\n' \
            "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY")
          existing=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
